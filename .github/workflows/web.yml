name: Web-App

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Cloud-Skript und Web-App prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloud-Skript testen
        run: node --test cloud/test/cloud.test.js
      - name: Browser installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Web-App im Browser testen
        run: node --test --test-timeout=90000 web/test/web.test.js

  # Veröffentlicht die Web-App auf GitHub Pages, sobald der Stand auf dem Hauptzweig liegt.
  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.bereitstellung.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: bereitstellung
        uses: actions/deploy-pages@v4
