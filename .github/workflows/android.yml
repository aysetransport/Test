name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Prüfen und APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Die Abgleich-Tests starten das Cloud-Skript in einer nachgebildeten Google-Umgebung (Node.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signaturschlüssel aus den Secrets des Repositorys (optional, siehe docs/ANLEITUNG-2.0.md).
      # Damit tragen alle künftigen APKs dieselbe Signatur und lassen sich über die vorige installieren.
      - name: Signaturschlüssel bereitlegen
        env:
          SIGNATUR_BASE64: ${{ secrets.SIGNATUR_BASE64 }}
        run: |
          if [ -n "$SIGNATUR_BASE64" ]; then
            echo "$SIGNATUR_BASE64" | base64 -d > "$RUNNER_TEMP/signatur.jks"
            echo "SIGNATUR_DATEI=$RUNNER_TEMP/signatur.jks" >> "$GITHUB_ENV"
          else
            echo "Kein Signaturschlüssel hinterlegt – die APK wird mit einem Testschlüssel signiert."
          fi

      - name: Lint, Tests und Debug-APK
        env:
          SIGNATUR_PASSWORT: ${{ secrets.SIGNATUR_PASSWORT }}
          SIGNATUR_ALIAS: ${{ secrets.SIGNATUR_ALIAS }}
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Ayse-CRM-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3 # Speicherplatz von GitHub ist begrenzt

      - name: Berichte bei Fehlern bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Berichte
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 3 # Speicherplatz von GitHub ist begrenzt
