name: Android

# Nur beim Veröffentlichen und nur wenn sich die Android-App ändert (web/ kommt über das In-App-Update).
on:
  push:
    branches: [claude/android-schadensfall-app-krncja]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # für den Release „android-app“ mit der APK

jobs:
  build:
    name: Prüfen und APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Die Abgleich-Tests starten das Cloud-Skript in einer nachgebildeten Google-Umgebung (Node.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # Fester Signaturschlüssel nur aus den Secrets (öffentliches Repository). Ohne ihn: Prüfen und Bauen ja, Veröffentlichen nein.
      # Damit tragen alle künftigen APKs dieselbe Signatur und lassen sich über die vorige installieren.
      - name: Signaturschlüssel bereitlegen
        env:
          SIGNATUR_BASE64: ${{ secrets.SIGNATUR_BASE64 }}
        run: |
          if [ -n "$SIGNATUR_BASE64" ]; then
            echo "$SIGNATUR_BASE64" | base64 -d > "$RUNNER_TEMP/signatur.p12"
            echo "SIGNATUR_DATEI=$RUNNER_TEMP/signatur.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNATUR_BASE64 fehlt – die APK wird gebaut, aber nicht veröffentlicht."
          fi

      # Fortlaufende versionCode, damit das App-Update jede neue APK als neuer erkennt (build.gradle.kts)
      - name: Versionsnummer
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - name: Lint, Tests, Debug- und Release-APK
        env:
          SIGNATUR_PASSWORT: ${{ secrets.SIGNATUR_PASSWORT }}
          SIGNATUR_ALIAS: ${{ secrets.SIGNATUR_ALIAS }}
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      # Neueste signierte APK als Release „android-app“ in diesem Repository (wie bei Windows): Releases zählen nicht
      # zum begrenzten Speicher für Build-Dateien. Nur mit festem Schlüssel – sonst ließe sie sich nicht über die
      # installierte App installieren.
      - name: APK als Release bereitstellen
        if: github.ref_name == github.event.repository.default_branch && env.SIGNATUR_DATEI != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Ayse-CRM.apk"
          notiz="Neueste Android-App: Ayse-CRM.apk (versionCode $VERSION_CODE, Commit $GITHUB_SHA)"
          gh release view android-app > /dev/null 2>&1 || gh release create android-app --title "Android-App" --notes "$notiz" --target "$GITHUB_SHA"
          gh release edit android-app --notes "$notiz"
          gh release upload android-app "$RUNNER_TEMP/Ayse-CRM.apk" --clobber

      # App-Update für die installierten Apps: Release „android-app“ im öffentlichen Repository aysetransport/schaden.
      # Nur mit festem Signaturschlüssel (sonst ließe sich die APK nicht über die installierte installieren) und
      # mit dem Secret SCHADEN_TOKEN (Fine-grained Token, nur aysetransport/schaden, Contents: Read and write).
      - name: App-Update veröffentlichen
        if: github.ref_name == github.event.repository.default_branch && env.SIGNATUR_DATEI != ''
        env:
          GH_TOKEN: ${{ secrets.SCHADEN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Kein SCHADEN_TOKEN hinterlegt – App-Update wird nicht veröffentlicht."; exit 0; fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Ayse-CRM.apk"
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          sha=$(sha256sum "$RUNNER_TEMP/Ayse-CRM.apk" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$VERSION_CODE" "$name ($VERSION_CODE)" "$sha" > "$RUNNER_TEMP/android-update.json"
          R=aysetransport/schaden
          gh release view android-app -R $R > /dev/null 2>&1 || gh release create android-app -R $R --title "Android-App" --notes "Neueste Android-App (In-App-Update)"
          # Erst die APK, dann die Beschreibung – so zeigt android-update.json nie auf eine fehlende APK.
          gh release upload android-app -R $R "$RUNNER_TEMP/Ayse-CRM.apk" --clobber
          gh release upload android-app -R $R "$RUNNER_TEMP/android-update.json" --clobber

      - name: APK bereitstellen
        continue-on-error: true # volles Speicherkontingent für Build-Dateien darf den Lauf nicht rot machen (APK kommt per Release)
        uses: actions/upload-artifact@v4
        with:
          name: Ayse-CRM-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3 # Speicherplatz von GitHub ist begrenzt

      - name: Berichte bei Fehlern bereitstellen
        continue-on-error: true # volles Speicherkontingent für Build-Dateien darf den Lauf nicht rot machen (APK kommt per Release)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Berichte
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 3 # Speicherplatz von GitHub ist begrenzt
