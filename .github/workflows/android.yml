name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Prüfen und APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Die Abgleich-Tests starten das Cloud-Skript in einer nachgebildeten Google-Umgebung (Node.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, Tests und Debug-APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schadensfaelle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Berichte bei Fehlern bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Berichte
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
