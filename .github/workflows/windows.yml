name: Windows-App

# Nur beim Veröffentlichen (Standard-Branch) und nur wenn sich die Windows-App ändert – getestet wird vorher lokal.
# Oberflächen-Änderungen (web/) kommen ohne neuen Installer über das In-App-Update.
on:
  push:
    branches: [claude/android-schadensfall-app-krncja]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write # für den Release mit dem Installer

jobs:
  windows:
    name: Testen, Installer bauen und installiert prüfen
    # Eigener Windows-Rechner im Büro (GitHub-„Runner“): keine Actions-Minuten. Zurück auf GitHub: windows-latest.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Für den Test-Mailserver (GreenMail)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten
        run: npm ci

      - name: Tests (Mail-Anbindung und gestartete App)
        run: npm test

      - name: Installer bauen
        run: npm run dist:win

      # Auf GitHubs Rechnern: echt installieren. Auf dem Büro-PC nicht (dort ist die App schon installiert und läuft) –
      # stattdessen das fertig gepackte Programm aus dist\win-unpacked prüfen.
      - name: Gepacktes Programm starten (Büro-PC)
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\win-unpacked\*.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          node scripts/rauchtest.js $exe.FullName

      - name: Installieren und installiertes Programm starten
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Schadensfaelle-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\schadensfaelle\Schadensfälle.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 2 | Select-Object FullName; throw "Nicht installiert: $exe" }
          node scripts/rauchtest.js $exe

      # Als Release statt als Build-Datei: Releases zählen nicht zum (begrenzten) Speicher für Build-Dateien.
      # Nur vom Standard-Branch, immer derselbe Release „windows-app“ mit dem neuesten Installer.
      - name: Installer als Release bereitstellen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\Schadensfaelle-Setup-*.exe | Select-Object -First 1
          $notiz = "Neuester Installer der Windows-App: $($setup.Name) (Commit $env:GITHUB_SHA)"
          gh release view windows-app *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows-app --title "Windows-App" --notes $notiz --target $env:GITHUB_SHA }
          else { gh release edit windows-app --notes $notiz }
          gh release upload windows-app $setup.FullName --clobber
          foreach ($alt in (gh release view windows-app --json assets -q '.assets[].name')) { if ($alt -ne $setup.Name) { gh release delete-asset windows-app $alt -y } }

      # App-Update für die installierten Apps (electron-updater, siehe package.json → build.publish): Release
      # „windows-app“ im öffentlichen Repository aysetransport/schaden. Braucht das Secret SCHADEN_TOKEN
      # (Fine-grained Token, nur aysetransport/schaden, Contents: Read and write).
      - name: App-Update veröffentlichen
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SCHADEN_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "Kein SCHADEN_TOKEN hinterlegt – App-Update wird nicht veröffentlicht."; exit 0 }
          if (-not (Test-Path dist\latest.yml)) { throw "dist\latest.yml fehlt (build.publish in package.json?)" }
          $setup = Get-ChildItem dist\Schadensfaelle-Setup-*.exe | Select-Object -First 1
          $neu = @($setup.Name, "$($setup.Name).blockmap", "latest.yml")
          $R = "aysetransport/schaden"
          gh release view windows-app -R $R *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows-app -R $R --title "Windows-App" --notes "Neueste Windows-App (Installer und In-App-Update)" }
          # Erst Installer und Blockmap, zuletzt latest.yml – so zeigt latest.yml nie auf einen fehlenden Installer.
          gh release upload windows-app -R $R $setup.FullName "$($setup.FullName).blockmap" --clobber
          gh release upload windows-app -R $R dist\latest.yml --clobber
          foreach ($alt in (gh release view windows-app -R $R --json assets -q '.assets[].name')) { if ($neu -notcontains $alt) { gh release delete-asset windows-app $alt -R $R -y } }
